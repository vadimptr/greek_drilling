name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.actor }}/greek_drilling/app:latest
  API_IMAGE_NAME: ${{ github.actor }}/greek_drilling/api:latest
  PROJECT_NAME: greek_drilling

jobs:
  build:
    name: Test, build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build (and push on master)
        run: |
          PUSH=${{ github.event_name == 'push' && '--push' || '' }}
          docker buildx build --platform linux/amd64,linux/arm64 $PUSH --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} .
          docker buildx build --platform linux/amd64,linux/arm64 $PUSH --target api --tag ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }} .

  deploy:
    name: Deploy to home mac
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Docker compose pull and up
        uses: appleboy/ssh-action@v1.0.2
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          script_stop: true
          script: ${{ vars.WORK_DIR }}/deploy.sh deploy ${{ env.PROJECT_NAME }}
