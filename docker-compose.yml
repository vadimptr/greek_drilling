services:
  greek-drilling:
    image: ghcr.io/vadimptr/greek_drilling/app:latest
    ports:
      - "9093:80"
    depends_on:
      - api
    networks:
      - default
      - infra   # доступ к whisper-server (deploy/whisper), сеть создаётся один раз: docker network create infra
    restart: unless-stopped

  api:
    image: ghcr.io/vadimptr/greek_drilling/api:latest
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required in .env}
      CITY_ALLOWED_USERS: ${CITY_ALLOWED_USERS:-}
      CITY_DAILY_TALKS: ${CITY_DAILY_TALKS:-40}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-agent_5001m6153pjwfjf84269kkmrz7a6}
      ELEVENLABS_VOICES: ${ELEVENLABS_VOICES:-}
      ELEVENLABS_SPEED: ${ELEVENLABS_SPEED:-0.9}
      CITY_IMAGES: ${CITY_IMAGES:-}
      CITY_IMAGE_MODEL: ${CITY_IMAGE_MODEL:-}
    volumes:
      - data:/data
    restart: unless-stopped

networks:
  infra:
    external: true

volumes:
  data:
