services:
  greek-drilling:
    image: ghcr.io/vadimptr/greek_drilling/app:latest
    depends_on:
      - api
    networks:
      - default
      - infra   # доступ к whisper-server (deploy/whisper), сеть создаётся один раз: docker network create infra
    restart: unless-stopped

  api:
    image: ghcr.io/vadimptr/greek_drilling/api:latest
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required in .env}
      CITY_ALLOWED_USERS: ${CITY_ALLOWED_USERS:-}
      CITY_DAILY_TALKS: ${CITY_DAILY_TALKS:-40}
      CITY_DAILY_STORIES: ${CITY_DAILY_STORIES:-15}
      CITY_POOL_SIZE: ${CITY_POOL_SIZE:-3}
      CITY_POOL_SIZES: ${CITY_POOL_SIZES:-A1:10,A2:5,B1:3,en.A1:3,en.A2:2,en.B1:1,ru.A1:3,ru.A2:2,ru.B1:1}
      CITY_STORY_MODEL: ${CITY_STORY_MODEL:-claude-opus-5-5}
      CITY_HELPER_MODEL: ${CITY_HELPER_MODEL:-claude-haiku-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-agent_5001m6153pjwfjf84269kkmrz7a6}
      ELEVENLABS_VOICES: ${ELEVENLABS_VOICES:-}
      ELEVENLABS_VOICES_EN: ${ELEVENLABS_VOICES_EN:-male-young=Sq93GQT4X1lKDXsQcixO,male-middle=Fahco4VZzobUeiPqni1S,male-old=0lp4RIz96WD1RUtvEu3Q,female-young=lcMyyd2HUfFzxdCaC4Ta,female-middle=exsUS4vynmxd379XN4yO,female-old=kkPJzQOWz2Oz9cUaEaQd}
      ELEVENLABS_VOICES_RU: ${ELEVENLABS_VOICES_RU:-male-young=izZy1DKVkUJebQ8QmSqr,male-middle=rQOBu7YxCDxGiFdTm28w,male-old=LTkx8oHrUXaND7aaxdTA,female-young=Jbte7ht1CqapnZvc4KpK,female-middle=0ArNnoIAWKlT4WweaVMY,female-old=ZgfahluxUmUzBjjL81NN}
      ELEVENLABS_SPEED: ${ELEVENLABS_SPEED:-0.9}
      CITY_IMAGES: ${CITY_IMAGES:-}
      CITY_IMAGE_MODEL: ${CITY_IMAGE_MODEL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - data:/data
    restart: unless-stopped

networks:
  infra:
    external: true

volumes:
  data:
