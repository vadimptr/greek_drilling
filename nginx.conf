server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/manifest+json text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # распознавание речи: whisper-server из соседнего compose (docker-сеть infra)
    location = /api/transcribe {
        proxy_pass http://whisper:8080/inference;
        proxy_http_version 1.1;
        client_max_body_size 2m;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
